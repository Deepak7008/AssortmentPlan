<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Cards Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 p-6 min-h-screen max-w-sm mx-auto border-x border-slate-800">
    
    <div class="mb-6 border-b border-slate-800 pb-4">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Mobile Planner Feed (Proposed)</h2>
        <p class="text-[10px] text-slate-500 mt-1">Replaces the horizontal scrolling table</p>
    </div>

    <!-- Planner Card 1 -->
    <div class="bg-slate-900 border border-slate-700/50 rounded-2xl p-4 mb-4 shadow-lg shadow-black/50">
        <!-- Header -->
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center">
                    <svg class="w-5 h-5 text-[#38bdf8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-100">Alex Johnson</h3>
                    <p class="text-[11px] font-medium text-slate-400">Apparel • US • Fall</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-lg font-black text-white">85%</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full h-1.5 bg-slate-800 rounded-full mt-4 mb-4 border border-white/5 overflow-hidden">
            <div class="h-1.5 rounded-full bg-gradient-to-r from-[#0ea5e9] to-[#a855f7]" style="width: 85%"></div>
        </div>

        <!-- Deadlines Row -->
        <div class="flex gap-2">
            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#22c55e]/10 border border-[#22c55e]/30">
                <div class="w-1.5 h-1.5 rounded-full bg-[#4ade80]"></div>
                <span class="text-[9px] font-bold text-[#4ade80] uppercase tracking-wider">Init: Feb 12</span>
            </div>
            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#f59e0b]/10 border border-[#f59e0b]/30">
                <div class="w-1.5 h-1.5 rounded-full bg-[#fbbf24]"></div>
                <span class="text-[9px] font-bold text-[#fbbf24] uppercase tracking-wider">Rev: Mar 01</span>
            </div>
        </div>
    </div>

    <!-- Planner Card 2 -->
    <div class="bg-slate-900 border border-slate-700/50 rounded-2xl p-4 mb-4 shadow-lg shadow-black/50">
        <!-- Header -->
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center">
                    <svg class="w-5 h-5 text-[#38bdf8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-100">Samantha Lee</h3>
                    <p class="text-[11px] font-medium text-slate-400">Footwear • EU • Spring</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-lg font-black text-white">42%</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full h-1.5 bg-slate-800 rounded-full mt-4 mb-4 border border-white/5 overflow-hidden">
            <div class="h-1.5 rounded-full bg-gradient-to-r from-[#0ea5e9] to-[#a855f7]" style="width: 42%"></div>
        </div>

        <!-- Deadlines Row -->
        <div class="flex gap-2">
            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#22c55e]/10 border border-[#22c55e]/30">
                <div class="w-1.5 h-1.5 rounded-full bg-[#4ade80]"></div>
                <span class="text-[9px] font-bold text-[#4ade80] uppercase tracking-wider">Init: Jan 15</span>
            </div>
            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-[#ef4444]/10 border border-[#ef4444]/30 animate-pulse">
                <div class="w-1.5 h-1.5 rounded-full bg-[#f87171]"></div>
                <span class="text-[9px] font-bold text-[#f87171] uppercase tracking-wider">Rev: Feb 20 (LATE)</span>
            </div>
        </div>
    </div>

</body>
</html>
